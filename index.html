<!doctype html>
<html lang="en-AU">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0f6b5c">
  <meta name="description" content="C.A.S.H — Control All Spending Habits. Track your family's spending, bills, wages and savings.">
  <title>C.A.S.H</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/logo.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div class="layout">
    <aside class="sidebar">
      <a class="brand" href="#home">
        <img src="icons/logo.svg" alt="">
        <span><b>C.A.S.H</b><small>Control All Spending Habits</small></span>
      </a>
      <nav class="side-nav" id="side-nav" aria-label="Main"></nav>
      <button class="btn primary block" data-action="openAdd">＋ Add</button>
    </aside>
    <div class="main-col">
      <header class="topbar" id="topbar"></header>
      <main id="view"></main>
    </div>
  </div>
  <nav class="bottom-nav" id="bottom-nav" aria-label="Main"></nav>
  <div class="sheet-wrap" id="sheet-wrap" hidden>
    <div class="sheet-backdrop" data-action="closeSheet"></div>
    <div class="sheet" id="sheet" role="dialog" aria-modal="true"></div>
  </div>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <div class="tip" id="tip" hidden></div>
  <noscript>C.A.S.H needs JavaScript turned on.</noscript>
  <script type="module" src="js/app.js"></script>
</body>
</html>
